<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review Room</title>
    <style>
      /*STYLES*/
    </style>
  </head>
  <body>
    <main id="room">
      <section id="overview" aria-labelledby="overview-title">
        <header class="overview-header">
          <div>
            <h1 id="overview-title">Your reviews</h1>
            <p id="overview-meta" class="muted">Loading reviews…</p>
          </div>
          <div id="overview-actions"></div>
        </header>
        <label class="search-field" id="review-search-field"
          ><span class="sr-only">Search reviews</span
          ><input
            id="review-search"
            type="search"
            placeholder="Search reviews"
            autocomplete="off"
        /></label>
        <p id="overview-error" class="error" role="alert"></p>
        <div id="cards" class="review-grid" aria-label="Reviews"></div>
        <div id="empty" class="empty-state" hidden>
          <div id="empty-icon"></div>
          <h2 id="empty-title">No reviews yet</h2>
          <p id="empty-description">
            Reviews started in your chat will appear here.
          </p>
        </div>
      </section>
      <section id="discussion" aria-labelledby="review-title" hidden>
        <header class="discussion-header">
          <div class="review-heading">
            <div id="back-control"></div>
            <div class="review-heading-text">
              <h1 id="review-title" tabindex="-1"></h1>
              <p id="review-meta" class="muted"></p>
            </div>
            <div id="review-status"></div>
            <div id="review-actions"></div>
          </div>
          <div id="participants" class="participants"></div>
          <p id="discussion-error" class="error" role="alert"></p>
        </header>
        <div
          id="messages"
          class="conversation"
          role="log"
          aria-label="Review discussion"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
        <footer class="discussion-footer">
          <details id="artifact" hidden>
            <summary></summary>
            <code></code>
          </details>
        </footer>
      </section>
    </main>
    <script type="module">
      /*SCRIPT*/
    </script>
  </body>
</html>
