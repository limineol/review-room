<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review Room</title>
    <style>
      /*STYLES*/
    </style>
  </head>
  <body>
    <header>
      <span id="status">No active review</span
      ><button id="request" class="primary">Request review</button>
    </header>
    <nav>
      <select id="history" aria-label="Review history">
        <option value="">Choose a review</option>
      </select>
    </nav>
    <p id="error" role="alert"></p>
    <section id="empty">
      <p>
        Reviews run through the agent in your chat. Their progress and
        discussion appear here.
      </p>
      <p class="muted">
        Allowed harnesses, models, and session reuse are configured in Review
        Room’s plugin settings.
      </p>
    </section>
    <section id="discussion" hidden>
      <div class="review-toolbar">
        <span id="participants"></span><button id="stop">Stop review</button>
      </div>
      <div id="messages" role="log" aria-live="polite"></div>
      <p id="artifact" class="muted"></p>
      <p class="muted">
        Ask questions and request follow-ups in the main chat.
      </p>
    </section>
    <script type="module">
      /*SCRIPT*/
    </script>
  </body>
</html>
