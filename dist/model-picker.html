<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reviewer models</title>
    <style>
      /* Framework-free MCP App styles. */

@layer base {
  :root {
    color-scheme: light dark;
    --background: var(
      --color-background-primary,
      light-dark(rgb(255 255 255), rgb(24 24 24))
    );
    --foreground: var(
      --color-text-primary,
      light-dark(rgb(26 28 31), rgb(255 255 255))
    );
    --card: color-mix(in oklab, var(--foreground) 5%, var(--background));
    --card-foreground: var(--color-text-primary, var(--foreground));
    --primary: var(
      --color-text-info,
      light-dark(rgb(51 156 255), rgb(131 195 255))
    );
    --primary-foreground: var(
      --color-text-inverse,
      light-dark(rgb(255 255 255), rgb(13 13 13))
    );
    --secondary: var(
      --color-background-secondary,
      light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%))
    );
    --secondary-foreground: var(--color-text-primary, var(--foreground));
    --muted: color-mix(in srgb, var(--foreground) 10%, transparent);
    --muted-foreground: var(
      --color-text-secondary,
      light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%))
    );
    --accent: var(
      --color-background-info,
      light-dark(rgb(229 242 255), rgb(13 39 63))
    );
    --accent-foreground: var(--color-text-info, var(--primary));
    --destructive: var(
      --color-text-warning,
      light-dark(rgb(226 85 7), rgb(255 133 73))
    );
    --border: var(
      --color-border-secondary,
      light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
    );
    --input: var(
      --color-border-primary,
      light-dark(rgb(26 28 31 / 11.8%), rgb(255 255 255 / 12%))
    );
    --ring: var(--color-ring-primary, var(--primary));
    --font-size-base: var(--font-text-md-size, 14px);
    --radius: var(--border-radius-lg, 12.5px);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  body {
    margin: 0;
    color: var(--foreground);
    background: var(--background);
    font-size: max(11px, var(--font-size-base));
    font-weight: var(--font-weight-normal, 430);
    line-height: 1.5;
  }

  /* MCP sandboxes can force their own font on body, so restore the host font below it. */
  body,
  body > * {
    font-family: var(
      --font-sans,
      -apple-system,
      system-ui,
      "Segoe UI",
      sans-serif
    );
  }

  h1,
  h2,
  h3,
  p {
    margin-block: 0;
  }

  h1,
  h2,
  h3 {
    font-weight: var(--font-weight-medium, 500);
    line-height: 1.25;
  }

  h1 {
    font-size: calc(var(--font-size-base) * 1.7142857143);
  }

  h2 {
    font-size: calc(var(--font-size-base) * 1.4285714286);
  }

  h3 {
    font-size: calc(var(--font-size-base) * 1.2857142857);
  }
}

@layer components {
  .cursor-interaction {
    cursor: var(--cursor-interaction, pointer);
  }

  .card {
    min-width: 0;
    padding: 12px;
    overflow-wrap: break-word;
    border-radius: calc(var(--radius) * 1.6);
    corner-shape: superellipse(1.5);
    color: var(--card-foreground);
    background: var(--card);
  }

  .btn,
  .form-check-input,
  .form-control,
  .form-select {
    box-sizing: border-box;
    font: inherit;
  }

  .btn {
    appearance: button;
    display: inline-flex;
    inline-size: fit-content;
    max-inline-size: 100%;
    min-height: 28px;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--secondary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
  }

  .btn:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn-primary {
    border-color: transparent;
    color: var(--primary-foreground);
    background: var(--foreground);
    background-clip: padding-box;
  }

  .btn-primary:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 80%, transparent);
    background-clip: padding-box;
  }

  .btn-ghost {
    border-color: transparent;
    color: var(--muted-foreground);
    background: transparent;
  }

  .btn-ghost:not(:disabled):hover {
    color: var(--foreground);
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn:not(.btn-primary):is([aria-pressed="true"], [aria-selected="true"]) {
    border-color: var(--primary);
    color: var(--primary-foreground);
    background: var(--primary);
  }

  .btn:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .btn:disabled,
  .form-check-input:disabled,
  .form-control:disabled,
  .form-select:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    color: var(--foreground);
  }

  .form-control,
  .form-select {
    display: block;
    width: 100%;
    min-height: 28px;
    padding: 0 8px;
    outline: none;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--foreground);
    background: var(--secondary);
  }

  .form-control::placeholder {
    color: var(--muted-foreground);
  }

  .form-select {
    appearance: none;
    padding-right: 32px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
      linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
    background-position:
      calc(100% - 14px) 50%,
      calc(100% - 10px) 50%;
    background-repeat: no-repeat;
    background-size: 4px 4px;
    cursor: var(--cursor-interaction, pointer);
  }

  .form-select:not(:disabled):hover {
    background-color: color-mix(
      in srgb,
      var(--foreground) 6%,
      var(--secondary)
    );
  }

  textarea.form-control {
    min-height: 72px;
    padding: 8px 10px;
    resize: vertical;
  }

  .form-control:focus-visible,
  .form-select:focus-visible {
    border-color: var(--ring);
    box-shadow: inset 0 0 0 1px var(--ring);
  }

  .form-check {
    display: flex;
    min-height: 20px;
    align-items: center;
    gap: 8px;
  }

  .form-check-input {
    appearance: none;
    display: grid;
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    place-items: center;
    margin: 0;
    border: 1px solid var(--input);
    border-radius: 5px;
    corner-shape: superellipse(1.5);
    color: var(--primary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
  }

  .form-check-input:checked {
    border-color: var(--primary);
    background: var(--primary);
  }

  .form-check-input:checked::after {
    width: 7px;
    height: 4px;
    border-bottom: 2px solid currentColor;
    border-left: 2px solid currentColor;
    content: "";
    transform: translateY(-1px) rotate(-45deg);
  }

  .form-check-input:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .form-check-label {
    color: var(--foreground);
  }

  svg.lucide {
    display: block;
    width: 16px;
    height: 16px;
    flex: none;
    stroke-width: 1.6;
  }

  .text-small {
    font-size: max(11px, calc(var(--font-size-base) - 2px));
  }

  .text-muted {
    color: var(--muted-foreground);
  }

  .text-destructive {
    color: var(--destructive);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
}
:root {
  color-scheme: light;
  font-family: var(
    --font-sans,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif
  );
  font-size: 14px;
  color: var(--color-text-primary, light-dark(#242424, #ececec));
  background: var(--color-background-primary, light-dark(#fff, #212121));
  --surface: var(--color-background-secondary, light-dark(#f6f6f6, #2b2b2b));
  --muted: var(--color-text-secondary, light-dark(#6d6d6d, #aaa));
  --line: var(--color-border-secondary, light-dark(#e9e9e9, #383838));
  --ink: var(--color-text-primary, light-dark(#242424, #ececec));
  --paper: var(--color-background-primary, light-dark(#fff, #212121));
}
:root[data-theme="dark"] {
  color-scheme: dark;
}
:root[data-theme="light"] {
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button,
input,
summary {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--color-border-info, #6d91b6);
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
button {
  border: 0;
}
.icon {
  display: inline-flex;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
}
.icon svg {
  width: 100%;
  height: 100%;
}
.icon-button {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  padding: 0;
  background: transparent;
  color: var(--muted);
  transition:
    background 0.15s,
    color 0.15s;
}
.icon-button:hover:not(:disabled) {
  background: var(--surface);
  color: var(--ink);
}
.primary {
  padding: 10px 17px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 9px;
  font-weight: 550;
  line-height: 20px;
  transition: opacity 0.15s;
}
.primary:hover:not(:disabled) {
  opacity: 0.85;
}
.avatar {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
}
.avatar svg {
  width: 19px;
  height: 19px;
}
.avatar.claude {
  color: light-dark(#a45338, #e4a58b);
  background: light-dark(#f8eee9, #382d28);
}
.avatar.codex {
  background: light-dark(#efefed, #333331);
}
.avatar.agent {
  background: light-dark(#eef1f4, #30363c);
  color: light-dark(#607084, #afbed0);
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.status-dot {
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 50%;
}
.status-badge.completed {
  color: light-dark(#44745b, #91b8a1);
}
.status-badge.running,
.status-badge.collecting {
  color: light-dark(#4b759b, #9dbde0);
}
.status-badge.failed {
  color: light-dark(#a54d48, #e6a09c);
}
.status-badge.partial,
.status-badge.interrupted {
  color: light-dark(#947039, #d6b67e);
}
.search-field {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0 12px;
  color: var(--muted);
}
.search-field:focus-within {
  border-color: var(--color-border-primary, light-dark(#cfcfcf, #666));
}
.search-field input {
  width: 100%;
  min-width: 0;
  padding: 10px 0;
  line-height: 20px;
  border: 0;
  outline: none;
  background: transparent;
}
.search-field input::placeholder {
  color: var(--muted);
}
.error {
  color: var(--color-text-danger, light-dark(#a54d48, #e6a09c));
  font-size: 13px;
  line-height: 1.5;
}
.error:empty {
  display: none;
}
.muted {
  color: var(--muted);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
[hidden] {
  display: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

.avatar.pi {
  font-size: 24px;
  font-family: ui-serif, serif;
  color: light-dark(#a36632, #e2bb8d);
  background: light-dark(#f6efe5, #383024);
}
.avatar.opencode {
  background: light-dark(#efefed, #333331);
}
.picker {
  padding: 24px 24px 0;
  display: flex;
  flex-direction: column;
  height: var(--picker-height, auto);
  max-height: var(--picker-max-height, none);
}
.picker-header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 30px;
  margin-bottom: 22px;
}
.picker-header .avatar {
  width: 37px;
  height: 37px;
  border-radius: 11px;
}
.picker-header .avatar svg {
  width: 22px;
  height: 22px;
}
.picker-header h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  line-height: 1.4;
}
.picker-header p {
  color: var(--muted);
  line-height: 1.5;
  font-size: 12px;
  margin-top: 4px;
}
.picker-toolbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.picker-toolbar .search-field {
  flex: 1;
  min-width: 0;
}
.picker-toolbar input {
  font-size: 13px;
  padding: 8px 0;
}
#refresh-control .icon-button {
  width: 36px;
  height: 36px;
}
#choices {
  flex: 1 1 auto;
  min-height: 100px;
  max-height: 420px;
  overflow-y: auto;
  overscroll-behavior: contain;
  margin: 0 -8px 12px;
  padding: 2px 8px;
  scrollbar-gutter: stable;
}
.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
.choice + .choice {
  margin-top: 2px;
}
.choice:hover {
  background: var(--surface);
}
.choice:has(input:checked) {
  background: var(--surface);
}
.choice input {
  flex: 0 0 auto;
  appearance: none;
  width: 17px;
  height: 17px;
  margin: 0;
  border: 1px solid var(--color-border-primary, light-dark(#bcbcbc, #777));
  border-radius: 5px;
  background: var(--paper);
  cursor: pointer;
}
.choice input:checked {
  border-color: var(--ink);
  background: var(--ink);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='m4 8 2.5 2.5L12 5' fill='none' stroke='%23fff' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
}
:root[data-theme="dark"] .choice input:checked {
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='m4 8 2.5 2.5L12 5' fill='none' stroke='%23222' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
}
.choice input:disabled {
  opacity: 0.5;
}
.choice-text {
  display: block;
  min-width: 0;
}
.choice-name {
  display: block;
  font-weight: 550;
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.choice-description {
  display: block;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.55;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.picker-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex: 0 0 auto;
  gap: 16px;
  padding: 16px 0 20px;
  margin-top: auto;
  border-top: 1px solid var(--line);
  background: var(--paper);
}
#count {
  font-size: 12px;
  font-weight: 500;
}
#status {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  margin-top: 3px;
}
#status:empty {
  display: none;
}
#save {
  white-space: nowrap;
  font-size: 13px;
}
#error {
  padding: 4px 0 12px;
  font-size: 12px;
}
.no-models {
  color: var(--muted);
  text-align: center;
  padding: 35px 16px;
  font-size: 13px;
  line-height: 1.6;
}
@media (max-width: 380px) {
  .picker {
    padding: 18px 16px 0;
  }
  .picker-header {
    flex-shrink: 0;
    padding-right: 22px;
  }
  .picker-header p {
    font-size: 11px;
  }
}

    </style>

  <body>
    <main class="picker">
      <header class="picker-header">
        <div id="provider-icon"></div>
        <div>
          <h1 id="title">Reviewer models</h1>
          <p>Choose which models can review your work.</p>
        </div>
      </header>
      <div class="picker-toolbar">
        <label class="search-field" id="model-search-field"
          ><span class="sr-only">Search models</span
          ><input
            id="search"
            type="search"
            placeholder="Search models"
            autocomplete="off"
        /></label>
        <div id="refresh-control"></div>
      </div>
      <p id="error" class="error" role="alert"></p>
      <div id="choices" role="group" aria-label="Allowed reviewer models"></div>
      <footer class="picker-footer">
        <div>
          <span id="count">0 selected</span>
          <p id="status" role="status">Loading models…</p>
        </div>
        <button id="save" class="primary" disabled>Save changes</button>
      </footer>
    </main>
