<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review Room</title>
    <style>
      /* Framework-free MCP App styles. */

@layer base {
  :root {
    color-scheme: light dark;
    --background: var(
      --color-background-primary,
      light-dark(rgb(255 255 255), rgb(24 24 24))
    );
    --foreground: var(
      --color-text-primary,
      light-dark(rgb(26 28 31), rgb(255 255 255))
    );
    --card: color-mix(in oklab, var(--foreground) 5%, var(--background));
    --card-foreground: var(--color-text-primary, var(--foreground));
    --primary: var(
      --color-text-info,
      light-dark(rgb(51 156 255), rgb(131 195 255))
    );
    --primary-foreground: var(
      --color-text-inverse,
      light-dark(rgb(255 255 255), rgb(13 13 13))
    );
    --secondary: var(
      --color-background-secondary,
      light-dark(rgb(255 255 255 / 96%), rgb(54 54 54 / 96%))
    );
    --secondary-foreground: var(--color-text-primary, var(--foreground));
    --muted: color-mix(in srgb, var(--foreground) 10%, transparent);
    --muted-foreground: var(
      --color-text-secondary,
      light-dark(rgb(26 28 31 / 49.4%), rgb(255 255 255 / 49.8%))
    );
    --accent: var(
      --color-background-info,
      light-dark(rgb(229 242 255), rgb(13 39 63))
    );
    --accent-foreground: var(--color-text-info, var(--primary));
    --destructive: var(
      --color-text-warning,
      light-dark(rgb(226 85 7), rgb(255 133 73))
    );
    --border: var(
      --color-border-secondary,
      light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
    );
    --input: var(
      --color-border-primary,
      light-dark(rgb(26 28 31 / 11.8%), rgb(255 255 255 / 12%))
    );
    --ring: var(--color-ring-primary, var(--primary));
    --font-size-base: var(--font-text-md-size, 14px);
    --radius: var(--border-radius-lg, 12.5px);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
  }

  body {
    margin: 0;
    color: var(--foreground);
    background: var(--background);
    font-size: max(11px, var(--font-size-base));
    font-weight: var(--font-weight-normal, 430);
    line-height: 1.5;
  }

  /* MCP sandboxes can force their own font on body, so restore the host font below it. */
  body,
  body > * {
    font-family: var(
      --font-sans,
      -apple-system,
      system-ui,
      "Segoe UI",
      sans-serif
    );
  }

  h1,
  h2,
  h3,
  p {
    margin-block: 0;
  }

  h1,
  h2,
  h3 {
    font-weight: var(--font-weight-medium, 500);
    line-height: 1.25;
  }

  h1 {
    font-size: calc(var(--font-size-base) * 1.7142857143);
  }

  h2 {
    font-size: calc(var(--font-size-base) * 1.4285714286);
  }

  h3 {
    font-size: calc(var(--font-size-base) * 1.2857142857);
  }
}

@layer components {
  .cursor-interaction {
    cursor: var(--cursor-interaction, pointer);
  }

  .card {
    min-width: 0;
    padding: 12px;
    overflow-wrap: break-word;
    border-radius: calc(var(--radius) * 1.6);
    corner-shape: superellipse(1.5);
    color: var(--card-foreground);
    background: var(--card);
  }

  .btn,
  .form-check-input,
  .form-control,
  .form-select {
    box-sizing: border-box;
    font: inherit;
  }

  .btn {
    appearance: button;
    display: inline-flex;
    inline-size: fit-content;
    max-inline-size: 100%;
    min-height: 28px;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--secondary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
    text-align: center;
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
  }

  .btn:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn-primary {
    border-color: transparent;
    color: var(--primary-foreground);
    background: var(--foreground);
    background-clip: padding-box;
  }

  .btn-primary:not(:disabled):hover {
    background: color-mix(in srgb, var(--foreground) 80%, transparent);
    background-clip: padding-box;
  }

  .btn-ghost {
    border-color: transparent;
    color: var(--muted-foreground);
    background: transparent;
  }

  .btn-ghost:not(:disabled):hover {
    color: var(--foreground);
    background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
  }

  .btn:not(.btn-primary):is([aria-pressed="true"], [aria-selected="true"]) {
    border-color: var(--primary);
    color: var(--primary-foreground);
    background: var(--primary);
  }

  .btn:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .btn:disabled,
  .form-check-input:disabled,
  .form-control:disabled,
  .form-select:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  .form-label {
    display: block;
    margin-bottom: 6px;
    color: var(--foreground);
  }

  .form-control,
  .form-select {
    display: block;
    width: 100%;
    min-height: 28px;
    padding: 0 8px;
    outline: none;
    border: 1px solid var(--input);
    border-radius: var(--radius);
    corner-shape: superellipse(1.5);
    color: var(--foreground);
    background: var(--secondary);
  }

  .form-control::placeholder {
    color: var(--muted-foreground);
  }

  .form-select {
    appearance: none;
    padding-right: 32px;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
      linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
    background-position:
      calc(100% - 14px) 50%,
      calc(100% - 10px) 50%;
    background-repeat: no-repeat;
    background-size: 4px 4px;
    cursor: var(--cursor-interaction, pointer);
  }

  .form-select:not(:disabled):hover {
    background-color: color-mix(
      in srgb,
      var(--foreground) 6%,
      var(--secondary)
    );
  }

  textarea.form-control {
    min-height: 72px;
    padding: 8px 10px;
    resize: vertical;
  }

  .form-control:focus-visible,
  .form-select:focus-visible {
    border-color: var(--ring);
    box-shadow: inset 0 0 0 1px var(--ring);
  }

  .form-check {
    display: flex;
    min-height: 20px;
    align-items: center;
    gap: 8px;
  }

  .form-check-input {
    appearance: none;
    display: grid;
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    place-items: center;
    margin: 0;
    border: 1px solid var(--input);
    border-radius: 5px;
    corner-shape: superellipse(1.5);
    color: var(--primary-foreground);
    background: var(--secondary);
    cursor: var(--cursor-interaction, pointer);
  }

  .form-check-input:checked {
    border-color: var(--primary);
    background: var(--primary);
  }

  .form-check-input:checked::after {
    width: 7px;
    height: 4px;
    border-bottom: 2px solid currentColor;
    border-left: 2px solid currentColor;
    content: "";
    transform: translateY(-1px) rotate(-45deg);
  }

  .form-check-input:focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
  }

  .form-check-label {
    color: var(--foreground);
  }

  svg.lucide {
    display: block;
    width: 16px;
    height: 16px;
    flex: none;
    stroke-width: 1.6;
  }

  .text-small {
    font-size: max(11px, calc(var(--font-size-base) - 2px));
  }

  .text-muted {
    color: var(--muted-foreground);
  }

  .text-destructive {
    color: var(--destructive);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
}
:root {
  color-scheme: light;
  font-family: var(
    --font-sans,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif
  );
  font-size: 14px;
  color: var(--color-text-primary, light-dark(#242424, #ececec));
  background: var(--color-background-primary, light-dark(#fff, #212121));
  --surface: var(--color-background-secondary, light-dark(#f6f6f6, #2b2b2b));
  --muted: var(--color-text-secondary, light-dark(#6d6d6d, #aaa));
  --line: var(--color-border-secondary, light-dark(#e9e9e9, #383838));
  --ink: var(--color-text-primary, light-dark(#242424, #ececec));
  --paper: var(--color-background-primary, light-dark(#fff, #212121));
}
:root[data-theme="dark"] {
  color-scheme: dark;
}
:root[data-theme="light"] {
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
button,
input,
summary {
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--color-border-info, #6d91b6);
  outline-offset: 3px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
button {
  border: 0;
}
.icon {
  display: inline-flex;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
}
.icon svg {
  width: 100%;
  height: 100%;
}
.icon-button {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 9px;
  padding: 0;
  background: transparent;
  color: var(--muted);
  transition:
    background 0.15s,
    color 0.15s;
}
.icon-button:hover:not(:disabled) {
  background: var(--surface);
  color: var(--ink);
}
.primary {
  padding: 10px 17px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 9px;
  font-weight: 550;
  line-height: 20px;
  transition: opacity 0.15s;
}
.primary:hover:not(:disabled) {
  opacity: 0.85;
}
.avatar {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink);
}
.avatar svg {
  width: 19px;
  height: 19px;
}
.avatar.claude {
  color: light-dark(#a45338, #e4a58b);
  background: light-dark(#f8eee9, #382d28);
}
.avatar.codex {
  background: light-dark(#efefed, #333331);
}
.avatar.agent {
  background: light-dark(#eef1f4, #30363c);
  color: light-dark(#607084, #afbed0);
}
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
.status-dot {
  width: 5px;
  height: 5px;
  background: currentColor;
  border-radius: 50%;
}
.status-badge.completed {
  color: light-dark(#44745b, #91b8a1);
}
.status-badge.running,
.status-badge.collecting {
  color: light-dark(#4b759b, #9dbde0);
}
.status-badge.failed {
  color: light-dark(#a54d48, #e6a09c);
}
.status-badge.partial,
.status-badge.interrupted {
  color: light-dark(#947039, #d6b67e);
}
.search-field {
  display: flex;
  align-items: center;
  gap: 9px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 0 12px;
  color: var(--muted);
}
.search-field:focus-within {
  border-color: var(--color-border-primary, light-dark(#cfcfcf, #666));
}
.search-field input {
  width: 100%;
  min-width: 0;
  padding: 10px 0;
  line-height: 20px;
  border: 0;
  outline: none;
  background: transparent;
}
.search-field input::placeholder {
  color: var(--muted);
}
.error {
  color: var(--color-text-danger, light-dark(#a54d48, #e6a09c));
  font-size: 13px;
  line-height: 1.5;
}
.error:empty {
  display: none;
}
.muted {
  color: var(--muted);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
[hidden] {
  display: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}

.avatar.pi {
  font-size: 24px;
  font-family: ui-serif, serif;
  color: light-dark(#a36632, #e2bb8d);
  background: light-dark(#f6efe5, #383024);
}
.avatar.opencode {
  background: light-dark(#efefed, #333331);
}
#room {
  max-width: 1120px;
  margin: 0 auto;
}
#overview {
  padding: 24px 28px 40px;
}
.overview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.overview-header h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.45px;
}
.overview-header p {
  font-size: 12px;
  margin-top: 6px;
}
#review-search-field {
  margin-bottom: 24px;
  max-width: 420px;
}
#overview-error {
  margin-bottom: 16px;
}
.review-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
  gap: 14px;
}
.review-card {
  display: flex;
  flex-direction: column;
  text-align: left;
  min-width: 0;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--paper);
  transition:
    border-color 0.15s,
    background 0.15s;
}
.review-card:hover {
  background: var(--surface);
  border-color: var(--color-border-primary, light-dark(#ccc, #555));
}
.card-top,
.card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.card-date {
  color: var(--muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.card-title {
  display: block;
  font-size: 15px;
  line-height: 1.45;
  font-weight: 550;
  letter-spacing: -0.15px;
  margin: 15px 0 9px;
  text-wrap: pretty;
  overflow-wrap: anywhere;
}
.card-project {
  display: flex;
  gap: 7px;
  align-items: center;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 22px;
}
.card-project .icon {
  width: 14px;
  height: 14px;
}
.card-project span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-bottom {
  margin-top: auto;
  padding-top: 13px;
  border-top: 1px solid var(--line);
}
.card-reviewers {
  display: flex;
  align-items: center;
  min-width: 0;
  flex: 1;
  gap: 5px;
}
.card-reviewers .avatar {
  width: 25px;
  height: 25px;
  border-radius: 8px;
}
.card-reviewers .avatar svg {
  width: 15px;
  height: 15px;
}
.card-models {
  color: var(--muted);
  font-size: 11px;
  margin-left: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-turns {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.card-bottom > .icon {
  color: var(--muted);
  width: 13px;
  height: 13px;
}
.empty-state {
  text-align: center;
  margin: 70px auto;
  max-width: 320px;
}
#empty-icon {
  display: inline-flex;
  padding: 14px;
  background: var(--surface);
  border-radius: 16px;
  color: var(--muted);
  margin-bottom: 18px;
}
#empty-icon .icon {
  width: 24px;
  height: 24px;
}
.empty-state h2 {
  font-size: 16px;
  font-weight: 550;
  margin-bottom: 8px;
}
.empty-state p {
  color: var(--muted);
  line-height: 1.6;
  font-size: 13px;
}
#discussion {
  height: 100dvh;
  min-height: 300px;
  display: flex;
  flex-direction: column;
}
.discussion-header {
  flex: 0 0 auto;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--line);
}
.review-heading {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.review-heading-text {
  flex: 1;
  min-width: 0;
  padding-top: 4px;
}
.review-heading h1 {
  font-size: 16px;
  line-height: 1.4;
  font-weight: 600;
  letter-spacing: -0.2px;
  overflow-wrap: anywhere;
  outline: none;
}
#review-meta {
  font-size: 11px;
  line-height: 1.5;
  margin-top: 5px;
}
#review-status {
  padding-top: 8px;
}
.participants {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 18px;
  margin-top: 15px;
  margin-left: 46px;
}
.participant {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
}
.participant .avatar {
  width: 22px;
  height: 22px;
  border-radius: 7px;
}
.participant .avatar svg {
  width: 14px;
  height: 14px;
}
.participant-state {
  opacity: 0.75;
}
.working-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #799ebc;
}
#discussion-error {
  padding-top: 12px;
}
.conversation {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 28px max(24px, calc((100% - 830px) / 2));
  scrollbar-gutter: stable;
}
.message {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0 0 24px;
}
.message > .avatar {
  margin-top: 24px;
}
.message-content {
  min-width: 0;
  flex: 1;
  max-width: 740px;
}
.message-byline {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 3px 7px;
  font-size: 11px;
  line-height: 1.4;
}
.speaker {
  font-weight: 550;
}
.message-time {
  color: var(--muted);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.message-bubble {
  background: var(--surface);
  padding: 17px 20px;
  border-radius: 3px 16px 16px 16px;
}
.from-agent {
  flex-direction: row-reverse;
  margin-left: 42px;
}
.from-agent .message-byline {
  justify-content: flex-end;
}
.from-agent .message-bubble {
  background: light-dark(#f0f3f6, #2b333a);
  border-radius: 16px 3px 16px 16px;
}
.from-agent .message-content {
  flex: 0 1 650px;
}
.message-body {
  font-size: 13px;
  line-height: 1.75;
  overflow-wrap: anywhere;
}
.message-body > :first-child {
  margin-top: 0;
}
.message-body > :last-child {
  margin-bottom: 0;
}
.message-body p {
  margin: 0 0 12px;
  color: inherit;
}
.message-body h1,
.message-body h2 {
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: -0.15px;
  font-weight: 600;
  margin: 22px 0 10px;
}
.message-body h3,
.message-body h4,
.message-body h5,
.message-body h6 {
  font-size: 13px;
  font-weight: 600;
  margin: 18px 0 8px;
}
.message-body ul,
.message-body ol {
  padding-left: 21px;
  margin: 8px 0 14px;
}
.message-body li {
  padding-left: 3px;
  margin: 5px 0;
}
.message-body li p {
  margin-bottom: 5px;
}
.message-body code {
  font-family: var(--font-mono, ui-monospace, SFMono-Regular, monospace);
  font-size: 0.9em;
  background: light-dark(#e8e8e8, #3b3b3b);
  padding: 2px 4px;
  border-radius: 4px;
}
.message-body pre {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 13px 15px;
  overflow: auto;
  margin: 14px 0;
  line-height: 1.6;
}
.message-body pre code {
  background: transparent;
  padding: 0;
  white-space: pre;
}
.message-body blockquote {
  border-left: 2px solid var(--color-border-primary, #aaa);
  padding-left: 14px;
  margin: 12px 0;
  color: var(--muted);
}
.message-body hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 20px 0;
}
.table-scroll {
  overflow: auto;
  margin: 12px 0;
}
.message-body table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}
.message-body th,
.message-body td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.message-body th {
  font-weight: 600;
}
.brief {
  padding: 13px 16px;
}
.brief summary,
.activity-group summary,
#artifact summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 12px;
}
summary::-webkit-details-marker {
  display: none;
}
.brief summary > .icon:last-child,
.activity-group summary > .icon:last-child,
#artifact summary > .icon:last-child {
  width: 12px;
  height: 12px;
  margin-left: auto;
  transition: transform 0.15s;
}
details[open] > summary > .icon:last-child {
  transform: rotate(90deg);
}
.brief .message-body {
  margin-top: 14px;
}
.activity-group {
  margin: -9px 0 20px 42px;
  color: var(--muted);
  max-width: 640px;
}
.activity-group summary {
  justify-content: flex-start;
  font-size: 11px;
  padding: 3px 0;
}
.activity-group summary > .icon:first-child {
  width: 13px;
  height: 13px;
}
.activity-group summary > .icon:last-child {
  margin-left: 0;
}
.activity-items {
  font-size: 11px;
  line-height: 1.8;
  padding-left: 30px;
  margin: 8px 0;
}
.timeline-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  margin: 14px 0 24px 42px;
  font-size: 11px;
}
.timeline-status .icon {
  width: 13px;
  height: 13px;
}
.message-error .message-bubble {
  border: 1px solid light-dark(#e7cbc7, #654844);
}
.conversation-empty {
  text-align: center;
  color: var(--muted);
  padding: 50px 0;
  font-size: 13px;
}
.discussion-footer {
  flex: 0 0 auto;
  padding: 12px 24px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--line);
}
#artifact {
  max-width: 780px;
  margin: 0 auto 8px;
  text-align: left;
}
#artifact summary {
  justify-content: center;
  font-size: 11px;
}
#artifact summary > .icon {
  width: 13px;
  height: 13px;
}
#artifact summary > .icon:last-child {
  margin-left: 0;
}
#artifact code {
  display: block;
  overflow-wrap: anywhere;
  font-size: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--surface);
  margin-top: 8px;
}
@media (max-width: 580px) {
  #overview {
    padding: 20px 16px;
  }
  .discussion-header {
    padding: 16px;
  }
  .review-heading {
    gap: 8px;
    flex-wrap: wrap;
  }
  #review-status {
    padding-top: 5px;
  }
  .participants {
    margin-left: 42px;
  }
  .conversation {
    padding: 22px 14px;
  }
  .message {
    gap: 8px;
  }
  .message > .avatar {
    width: 25px;
    height: 25px;
    border-radius: 8px;
  }
  .message > .avatar svg {
    width: 16px;
    height: 16px;
  }
  .message-bubble {
    padding: 14px;
  }
  .from-agent {
    margin-left: 15px;
  }
  .message-byline {
    flex-wrap: wrap;
    gap: 3px 8px;
  }
  .activity-group,
  .timeline-status {
    margin-left: 33px;
  }
}

.card-thread {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 15px 0 0;
  color: var(--muted);
  font-size: 11px;
}
.card-thread .icon,
.review-thread .icon {
  width: 13px;
  height: 13px;
}
.card-thread > span:last-child {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.card-thread + .card-title {
  margin-top: 8px;
}
.review-thread {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  margin-bottom: 6px;
}
.review-thread span:last-child {
  overflow-wrap: anywhere;
}

    </style>
  </head>
  <body>
    <main id="room">
      <section id="overview" aria-labelledby="overview-title">
        <header class="overview-header">
          <div>
            <h1 id="overview-title">Your reviews</h1>
            <p id="overview-meta" class="muted">Loading reviews…</p>
          </div>
          <div id="overview-actions"></div>
        </header>
        <label class="search-field" id="review-search-field"
          ><span class="sr-only">Search reviews</span
          ><input
            id="review-search"
            type="search"
            placeholder="Search reviews"
            autocomplete="off"
        /></label>
        <p id="overview-error" class="error" role="alert"></p>
        <div id="cards" class="review-grid" aria-label="Reviews"></div>
        <div id="empty" class="empty-state" hidden>
          <div id="empty-icon"></div>
          <h2 id="empty-title">No reviews yet</h2>
          <p id="empty-description">
            Reviews started in your chat will appear here.
          </p>
        </div>
      </section>
      <section id="discussion" aria-labelledby="review-title" hidden>
        <header class="discussion-header">
          <div class="review-heading">
            <div id="back-control"></div>
            <div class="review-heading-text">
              <p id="review-thread" class="review-thread"></p>
              <h1 id="review-title" tabindex="-1"></h1>
              <p id="review-meta" class="muted"></p>
            </div>
            <div id="review-status"></div>
            <div id="review-actions"></div>
          </div>
          <div id="participants" class="participants"></div>
          <p id="discussion-error" class="error" role="alert"></p>
        </header>
        <div
          id="messages"
          class="conversation"
          role="log"
          aria-label="Review discussion"
          aria-live="polite"
          aria-relevant="additions"
        ></div>
        <footer class="discussion-footer">
          <details id="artifact" hidden>
            <summary></summary>
            <code></code>
          </details>
        </footer>
      </section>
    </main>
